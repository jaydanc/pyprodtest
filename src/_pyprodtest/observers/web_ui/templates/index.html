<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ name }} · PyProdTest</title>
    <link rel="stylesheet" href="/assets/pico.min.css">
    <link rel="stylesheet" href="/assets/theme.css">
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="shell header-content">
        <a class="brand" href="/" aria-label="PyProdTest home">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span><strong>PyProdTest</strong><small>Operator console</small></span>
        </a>
        <div id="connection" class="connection connection-waiting" aria-live="polite">
          <span class="connection-dot"></span><span>Connecting</span>
        </div>
      </div>
    </header>

    <main class="shell workspace">
      <section class="run-overview" aria-labelledby="run-title">
        <div class="section-heading overview-heading">
          <div><span class="eyebrow">Test run</span><h1 id="run-title">{{ name }}</h1></div>
          <div id="summary" class="summary" aria-label="Run summary"></div>
        </div>
        <div class="progress-track" aria-label="Test progress"><span id="progress-bar"></span></div>
      </section>

      <section id="input-panel" class="operator-panel" hidden aria-live="assertive"></section>

      <section id="active-section" hidden aria-labelledby="active-title">
        <div class="section-heading">
          <div><span class="eyebrow active-eyebrow">In progress</span><h2 id="active-title">Current test</h2></div>
          <span class="live-indicator"><span></span>Live</span>
        </div>
        <div id="active-test"></div>
      </section>

      <section class="test-list-section" aria-labelledby="test-list-title">
        <div class="section-heading">
          <div><span class="eyebrow">Run details</span><h2 id="test-list-title">Tests</h2></div>
          <span id="test-list-count" class="muted-count"></span>
        </div>
        <div id="tests" class="test-list"><div class="empty-state" aria-busy="true">Waiting for collection…</div></div>
      </section>
    </main>
  </body>
</html>
