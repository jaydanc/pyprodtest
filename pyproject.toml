[project]
name = "pyprodtest"
version = "0.1.0"
description = "Pytest plugin for production testing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.entry-points.pytest11]
pyprodtest = "_pyprodtest.hooks"
